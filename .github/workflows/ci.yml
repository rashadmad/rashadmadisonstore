name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  storefront:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rashadmadisonstore-storefront
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: rashadmadisonstore-storefront/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: pk_ci_placeholder
          MEDUSA_BACKEND_URL: http://localhost:9000

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rashadmadisonstore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: rashadmadisonstore/package-lock.json
      - run: npm ci
      - run: npm run test:unit
      - run: npm run build
